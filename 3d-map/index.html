<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Giro3D 3D Map</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="view"></div>

    <aside id="click-popup" class="click-popup" hidden aria-live="polite">
      <div class="click-popup-header">
        <h2 id="click-popup-title">Layer value</h2>
        <button id="click-popup-close" class="click-popup-close" type="button" aria-label="Close popup">
          ×
        </button>
      </div>

      <label id="click-popup-select-label" class="click-popup-select-label" for="click-popup-select" hidden>
        Layer
      </label>
      <select id="click-popup-select" hidden></select>

      <p class="click-popup-meta">Value</p>
      <div class="click-popup-value-row">
        <p id="click-popup-value" class="click-popup-value">-</p>
        <span id="click-popup-units" class="click-popup-units" hidden></span>
      </div>

      <div id="click-popup-generation" class="click-popup-generation" hidden>
        <p class="click-popup-meta">Annual generation forecast</p>
        <div class="click-popup-generation-row">
          <p id="click-popup-generation-value" class="click-popup-generation-value">-</p>
          <span id="click-popup-generation-units" class="click-popup-units">kWh/m²/year</span>
        </div>
        <p class="click-popup-hint">
          Formula: POA × 0.22 efficiency × 0.8 losses
        </p>
      </div>
    </aside>

    <div class="map-ui" aria-label="Layer controls">
      <h2>Layers</h2>

      <div id="layers-list"></div>

      <label class="switch-row" for="hillshading-toggle">
        <input id="hillshading-toggle" type="checkbox" role="switch" checked />
        <span>Hillshading</span>
      </label>

      <label class="switch-row" for="terrain-deformation">
        <input id="terrain-deformation" type="checkbox"  checked />
        <span>Terrain deformation</span>
      </label>

      <section class="measure-widget" aria-label="Measurements">
        <h3>Measurements</h3>
        <div class="measure-actions">
          <button id="measure-distance" type="button">Distance</button>
          <button id="measure-area" type="button">Area</button>
          <button id="measure-height" type="button">Height</button>
          <button id="measure-angle" type="button">Angle</button>
          <button id="measure-clear" type="button">Clear</button>
        </div>
        <div class="measure-units">
          <label for="measure-length-unit">Lengths</label>
          <select id="measure-length-unit">
            <option value="m" selected>Meters</option>
            <option value="ft">Feet</option>
          </select>
          <label for="measure-area-unit">Areas</label>
          <select id="measure-area-unit">
            <option value="m" selected>m² / km²</option>
            <option value="ha">Hectares</option>
            <option value="acre">Acres</option>
          </select>
        </div>
      </section>

      <div class="view-actions" aria-label="Map navigation">
        <button id="home-button" class="icon-button" type="button" aria-label="Home" title="Home">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M12 3 3 10.5l1.4 1.7L6 10.9V21h12V10.9l1.6 1.3 1.4-1.7L12 3zm4 16h-3v-5h-2v5H8v-9.8l4-3.3 4 3.3V19z" />
          </svg>
        </button>
        <button id="zoom-in" class="icon-button" type="button" aria-label="Zoom in" title="Zoom in">+</button>
        <button id="zoom-out" class="icon-button" type="button" aria-label="Zoom out" title="Zoom out">-</button>
      </div>
      <p class="view-actions-hint">To rotate the map, use the right mouse button.</p>
    </div>

    <script type="module" src="./main.js"></script>
  </body>
</html>
